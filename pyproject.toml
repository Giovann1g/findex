[project]
name = "findex"
version = "0.1.0"
description = "findex — a full-text search engine over a personal corpus (Python course project)"
readme = "README.md"
authors = [
    { name = "Oleksandr Kukharskyi" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
