name: Release

# Pushing a tag like v0.4.0 builds the wheel + sdist and attaches them to a
# GitHub Release for that tag (created if it doesn't exist yet).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # needed to create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build
        run: uv build

      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean dist/*.whl
          /tmp/clean/bin/findex --help

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
