name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the project and dev tools
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format (ruff)
        run: uv run ruff format --check .

      - name: Types (pyright strict)
        run: uv run pyright

      - name: Tests + coverage (pytest, Hypothesis)
        run: uv run pytest --cov --cov-report=term-missing

      - name: Build the wheel and smoke-test it in a clean environment
        run: |
          uv build
          uv venv /tmp/clean
          uv pip install --python /tmp/clean dist/*.whl
          /tmp/clean/bin/findex --help
          /tmp/clean/bin/findex --version
